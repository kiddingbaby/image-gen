name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 固定版本，不用 go-version-file：显式钉住，保证本地与 CI 用同一个工具链。
          go-version: "1.26"
          cache: true

      # 版本与 .golangci.yml 的配置格式绑定：升 lint 版本前先在本地跑一次 make lint。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    strategy:
      fail-fast: false
      # macOS 按 10 倍、Windows 按 2 倍计入额度：日常只守 ubuntu + windows，
      # macOS 放到手动触发时加入（配置目录、文件权限这些平台差异发版前再验）。
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # 测试会起 httptest 假网关并落盘文件，Windows 的路径与权限差异就是靠这条守住的。
      - name: Test
        run: go test ./...

      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build
        run: go build -trimpath -o "${{ runner.temp }}/image-gen" .

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.26"
          go-package: ./...
