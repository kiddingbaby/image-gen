name: Feature request
description: 提议新参数、新行为或对现有命令的改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪里，为什么现有参数组合解决不了。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为或用法
      description: 命令行长什么样、输出应该是什么。若涉及新参数，说明默认值。
      render: shell
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案
      description: 环境变量、换模型、外层脚本等。
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面
      options:
        - label: 会改变现有命令行参数或默认值（可能破坏兼容）
        - label: 只新增能力，不影响既有用法
        - label: 只涉及文档
