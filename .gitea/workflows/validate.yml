name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # 这两个版本是在 Gitea runner 上验证过的；GitHub 侧用 v7，不要为了“统一”直接改。
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: 校验
        run: bash scripts/check.sh